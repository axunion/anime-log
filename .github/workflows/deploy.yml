name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate build/config only; do not deploy to production"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Dry-run: fake UUID is safe — wrangler.toml is only used for local build validation,
      # no remote D1 calls are made.
      - name: Generate wrangler.toml from template (dry-run)
        if: ${{ inputs.dry_run }}
        run: node scripts/render-wrangler-toml.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '00000000-0000-0000-0000-000000000000' }}

      # Real deploy: require the actual secret — render-wrangler-toml.mjs exits 1 if empty.
      - name: Generate wrangler.toml from template
        if: ${{ !inputs.dry_run }}
        run: node scripts/render-wrangler-toml.mjs
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - run: pnpm check

      - run: pnpm test

      - name: Apply D1 migrations
        if: ${{ !inputs.dry_run }}
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 migrations apply anime-db --remote

      - name: Build and deploy
        if: ${{ !inputs.dry_run }}
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          preCommands: pnpm build
          command: deploy

      - name: Build and dry-run deploy (validate only)
        if: ${{ inputs.dry_run }}
        uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          packageManager: pnpm
          preCommands: pnpm build
          command: deploy --dry-run
